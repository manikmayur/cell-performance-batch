[[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.enable_double_layer_capacitance]
default = false
description = "Enable double-layer capacitance (C_dl) in the SPMe model. Adds a non-Faradaic capacitive current term to the total interfacial current: j_total = j_BV + C_dl * d(phi_s - phi_e)/dt. Required for hybrid lithium-ion capacitor (LIC) simulations, e.g. activated-carbon EDLC positive + hard-carbon intercalation negative. Set per-electrode C_dl via positive/negative_electrode_double_layer_capacitance_F_m2. PyBaMM default C_dl is 0.2 F/m² when this is enabled and no override is provided."
type = "boolean"

[wrapper.input_schema.properties.simulation_parameters.properties.positive_electrode_double_layer_capacitance_F_m2]
description = "Double-layer capacitance of the positive electrode [F.m-2]. Only used when enable_double_layer_capacitance=True. Typical values: activated carbon EDLC ~0.1-0.4 F/m2, intercalation electrode ~0.01-0.05 F/m2. Defaults to the PyBaMM built-in value (~0.2 F/m²) when not set."

[[wrapper.input_schema.properties.simulation_parameters.properties.positive_electrode_double_layer_capacitance_F_m2.anyOf]]
exclusiveMinimum = 0
type = "number"

[[wrapper.input_schema.properties.simulation_parameters.properties.positive_electrode_double_layer_capacitance_F_m2.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.negative_electrode_double_layer_capacitance_F_m2]
description = "Double-layer capacitance of the negative electrode [F.m-2]. Only used when enable_double_layer_capacitance=True. Typical values: hard carbon ~0.01-0.05 F/m2, graphite ~0.01 F/m2, activated carbon EDLC ~0.1-0.4 F/m2. Defaults to the PyBaMM built-in value (~0.2 F/m²) when not set."

[[wrapper.input_schema.properties.simulation_parameters.properties.negative_electrode_double_layer_capacitance_F_m2.anyOf]]
exclusiveMinimum = 0
type = "number"

[[wrapper.input_schema.properties.simulation_parameters.properties.negative_electrode_double_layer_capacitance_F_m2.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.working_electrode]
description = "Optional working electrode for half-cell simulation. Set to 'positive' to simulate a half-cell with the positive electrode as the working electrode against a counter/reference electrode. The counter electrode defaults to lithium metal (OCP=0 V); use the reference_electrode_* fields to configure any other counter electrode (Na metal, pseudo-reference, Li alloy, etc.). To simulate a negative electrode half-cell (e.g. graphite vs counter), load the negative electrode material parameters into the positive electrode slots and set this to 'positive'. None (default) runs a full-cell simulation. Incompatible with perform_rpt=True."

[[wrapper.input_schema.properties.simulation_parameters.properties.working_electrode.anyOf]]
const = "positive"
type = "string"

[[wrapper.input_schema.properties.simulation_parameters.properties.working_electrode.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_exchange_current_density_A_m2]
description = "Exchange-current density for the counter/reference electrode [A.m-2]. Only used in half-cell mode (working_electrode='positive'). Applies to any counter electrode — Li metal, Na metal, pseudo-reference, etc. When None (default) the Xu2019 Li-metal function is used as a baseline: j0 = 3.5e-8 * F * c_Li^0.7 * c_e^0.3. Set to a positive scalar to override with a constant value appropriate for your counter electrode material."

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_exchange_current_density_A_m2.anyOf]]
exclusiveMinimum = 0
type = "number"

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_exchange_current_density_A_m2.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_ocp_V]
description = "Open-circuit potential of the counter/reference electrode [V]. Only used in half-cell mode (working_electrode='positive'). Applies to any counter electrode — Li metal (0.0 V), Na metal (~0.3 V vs Li/Li+), pseudo-reference, lithium alloy, etc. Defaults to 0.0 V. Set to the known equilibrium potential of your counter electrode."

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_ocp_V.anyOf]]
type = "number"

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_ocp_V.anyOf]]
type = "null"

[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_charge_transfer_coefficient]
description = "Butler-Volmer charge transfer coefficient for the counter/reference electrode (dimensionless, 0 < alpha < 1). Only used in half-cell mode (working_electrode='positive'). Applies to any counter electrode material. Defaults to 0.5 (symmetric kinetics). Controls the asymmetry of the anodic and cathodic reaction rates."

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_charge_transfer_coefficient.anyOf]]
exclusiveMaximum = 1
exclusiveMinimum = 0
type = "number"

[[wrapper.input_schema.properties.simulation_parameters.properties.reference_electrode_charge_transfer_coefficient.anyOf]]
type = "null"

[wrapper.input_schema.properties.fail_fast]
type = "boolean"
default = false
description = "Stop at the first failing design; the rest report status 'skipped'."

[wrapper.input_schema.properties.max_workers]
type = "integer"
default = 1
minimum = 1
maximum = 4
description = "Designs evaluated in parallel processes. >1 disables progress and fail_fast."

[wrapper.input_schema.properties.result_detail]
type = "string"
default = "kpis"
enum = ["full", "kpis", "summary"]
description = "full = every field; kpis = drop timeseries/experiments/BOM; summary = comparison scalars only. Defaults to 'kpis' because 'full' outgrows the log-line transport at two designs."

[wrapper.input_schema.properties.max_result_bytes]
type = "integer"
default = 15000
minimum = 0
description = "Serialised size the result is degraded to fit, with what was dropped reported under 'truncated'. 0 disables the guard. The default keeps the result inside one container log line."

