[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations]
description = "Optional custom termination conditions applied to every step. A triggered condition ends the current step only (PyBaMM step-level semantics); the experiment continues with subsequent steps and cycles."

[[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf]]
type = "array"

[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf.items]
additionalProperties = false
description = "Custom termination condition applied to every step in a PyBaMM experiment.\n\nAt each solver step, PyBaMM evaluates an event function that is configured\nbased on ``comparison``:\n\n- ``comparison='less_than'``: ``f(variables) = variables[variable] - threshold``\n- ``comparison='greater_than'``: ``f(variables) = threshold - variables[variable]``\n\nIn both cases, the step terminates when the event function becomes\nnon-positive (``f(variables) <= 0``), i.e. when the monitored variable\nhas crossed the specified threshold in the requested direction.\nExample — stop when anode potential drops below 0 V:\n    ExperimentTermination(variable=\"Anode potential [V]\", threshold=0.0)"
required = ["variable", "threshold"]
type = "object"

[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf.items.properties]

[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf.items.properties.variable]
description = "PyBaMM variable name to monitor, e.g. 'Anode potential [V]' or 'Cell temperature [K]'."
type = "string"

[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf.items.properties.threshold]
description = "Threshold value for the termination."
type = "number"

[wrapper.input_schema.properties.designs.items.properties.simulation_parameters.properties.experiments.anyOf.items.properties.terminations.anyOf.items.properties.comparison]
default = "less_than"
description = "'less_than': terminate when variable < threshold. 'greater_than': terminate when variable > threshold."
enum = ["less_than", "greater_than"]
type = "string"

