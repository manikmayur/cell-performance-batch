# Aris Protos wrapper declaration — see docs/WRAPPER_SPEC.md in protos-v2.
# Importing this repo via Models Library -> GitHub picks this file up and
# skips LLM wrapper drafting.
#
# THE SCHEMAS BELOW ARE GENERATED. Edit the Pydantic models, then run
#   python scripts/generate_protos_toml.py
# `pytest tests/test_protos_contract.py` fails if this file goes stale.
schema_version = 1

[model]
name = "Cell Performance Batch"
description = """
Evaluates an array of cell designs and returns an array of performance \
KPI sets — capacity, energy, energy/power density, DCIR, mass, volume, \
N/P ratio and OCV limits — one entry per design, in input order. Wraps \
the same equilibrium + PyBaMM SPMe pipeline as the single-design \
cell_performance model, with per-design failure isolation so one bad \
point never kills the sweep.
"""
language = "python"
license = "Proprietary"

[wrapper]
path = "protos/wrapper.py"

[wrapper.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
type = "object"
title = "Cell design batch"
required = ["designs"]

[wrapper.input_schema.properties]

[wrapper.input_schema.properties.designs]
type = "array"
description = "Cell designs to evaluate. Results come back in this order."

[wrapper.input_schema.properties.designs.items]
type = "object"
required = ["cell_parameters"]

[wrapper.input_schema.properties.designs.items.properties]

[wrapper.input_schema.properties.designs.items.properties.id]
type = "string"
description = "Optional identifier echoed back on the matching result."

[wrapper.input_schema.properties.designs.items.properties.name]
type = "string"
description = "Optional human-readable label for the design."

[wrapper.input_schema.properties.designs.items.properties.cell_parameters]
additionalProperties = false
description = "Cell design: geometry, electrode formulation, foils, separator, electrolyte and voltage limits."
required = ["positive_electrode_mass_loading_mg_cm2", "negative_electrode_mass_loading_mg_cm2", "positive_electrode_sheet_count", "negative_electrode_sheet_count", "jelly_roll_count", "electrode_coating_side_count", "form_factor", "positive_electrode_specific_heat_capacity_J_kg_K", "negative_electrode_specific_heat_capacity_J_kg_K", "positive_electrode_thermal_conductivity_W_m_K", "negative_electrode_thermal_conductivity_W_m_K", "positive_electrode_electronic_conductivity_S_m", "negative_electrode_electronic_conductivity_S_m", "positive_coating_thickness_um", "negative_coating_thickness_um", "positive_electrode_active_materials", "negative_electrode_active_materials", "positive_electrode_binders", "negative_electrode_binders", "positive_electrode_conductive_agents", "negative_electrode_conductive_agents", "positive_electrode_foil_thickness_um", "negative_electrode_foil_thickness_um", "positive_electrode_foil_density_g_cm3", "negative_electrode_foil_density_g_cm3", "positive_electrode_foil_electronic_conductivity_S_m", "negative_electrode_foil_electronic_conductivity_S_m", "positive_electrode_foil_specific_heat_capacity_J_kg_K", "negative_electrode_foil_specific_heat_capacity_J_kg_K", "positive_electrode_foil_thermal_conductivity_W_m_K", "negative_electrode_foil_thermal_conductivity_W_m_K", "separator_sheet_count", "separator_sheet_width_mm", "separator_sheet_height_mm", "separator_thickness_um", "separator_porosity", "separator_density_g_cm3", "separator_specific_heat_capacity_J_kg_K", "separator_thermal_conductivity_W_m_K", "electrolyte_density_g_cm3", "electrolyte_fill_ratio", "casing_thickness_mm", "casing_density_g_cm3", "electrode_overhang_mm", "jelly_roll_inner_diameter_mm", "volume_packing_ratio", "upper_voltage_cutoff_V", "lower_voltage_cutoff_V"]
type = "object"

