description = "Solver output sampling period [s]."
exclusiveMinimum = 0
type = "number"

[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.temperature_K]
description = "Ambient temperature for this experiment [K]."
exclusiveMinimum = 0
