description = "Configuration for a multi-step / multi-cycle PyBaMM experiment.\n\n``steps`` defines the sequence of operations in a single cycle, expressed\nas PyBaMM step strings (e.g. ``\"Discharge at 1C until 3.0 V\"``).  The\ncycle is repeated ``n_cycles`` times.\n\nExample (3-cycle charge-discharge):\n    ExperimentConfig(\n        label=\"cycle_aging\",\n        steps=[\n            \"Discharge at 1C until 3.0 V\",\n            \"Rest for 10 minutes\",\n            \"Charge at 1C until 4.2 V\",\n            \"Hold at 4.2 V until C/20\",\n            \"Rest for 10 minutes\",\n        ],\n        n_cycles=3,\n    )"
required = ["label", "steps", "n_cycles", "period_s", "temperature_K", "initial_soc_pct"]
type = "object"

[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties]

[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.label]
description = "Key used in the output dict."
type = "string"

[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.steps]
description = "Ordered list of steps forming one cycle.  Each element is either a PyBaMM step string, a DriveStepConfig (time-varying profile), or an EISStepConfig (impedance snapshot)."
minItems = 1
type = "array"

[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.steps.items]

[[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.steps.items.anyOf]]
type = "string"

[[wrapper.input_schema.properties.simulation_parameters.properties.experiments.anyOf.items.properties.steps.items.anyOf]]
additionalProperties = false
description = "Time-varying drive cycle step using a (time, value) profile.\n\nExactly one of ``current_A``, ``power_W``, or ``c_rate`` must be supplied.\nThe profile length must match ``time_s``.\n\nExample — 30-second power pulse followed by zero:\n    DriveStepConfig(\n        kind=\"drive_cycle\",\n        time_s=[0, 30, 30.01, 60],\n        power_W=[50.0, 50.0, 0.0, 0.0],\n    )"
required = ["time_s"]
type = "object"

